title: "Beef & Broccoli"
category: big
servings: 1
prep_time: "10 min"
cook_time: "15 min"
tags: [high_protein, quick]

ingredients:
  - { name: beef strips, amount: 160, unit: g, kcal: 400, protein: 28, carbs: 0, fat: 32 }
  - { name: broccoli, amount: 150, unit: g, kcal: 51, protein: 4.2, carbs: 10.5, fat: 0.6 }
  - { name: rice, amount: 120, unit: g, kcal: 156, protein: 3.2, carbs: 34, fat: 0.4 }
  - { name: soy sauce, amount: 20, unit: ml, kcal: 11, protein: 1.6, carbs: 1, fat: 0 }
  - { name: sesame oil, amount: 8, unit: ml, kcal: 70, protein: 0, carbs: 0, fat: 8 }

instructions:
  - Cook rice according to package directions.
  - Slice beef into thin strips. Season with salt and pepper.
  - Heat sesame oil in a wok over high heat. Sear beef for 2-3 minutes, then remove.
  - Add broccoli and stir-fry for 2 minutes with a splash of water.
  - Return beef to the wok, add soy sauce, and toss to combine.
  - Serve over rice.
