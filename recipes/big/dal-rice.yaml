title: "Dal & Rice"
category: big
servings: 1
prep_time: "10 min"
cook_time: "25 min"
tags: [vegetarian, indian, comfort]

ingredients:
  - { name: rice, amount: 80, unit: g, kcal: 284, protein: 5.6, carbs: 62, fat: 0.4 }
  - { name: toor dal, amount: 70, unit: g, kcal: 252, protein: 16, carbs: 42, fat: 1 }
  - { name: onion, amount: 80, unit: g, kcal: 32, protein: 0.9, carbs: 7.2, fat: 0.1 }
  - { name: tomato, amount: 100, unit: g, kcal: 18, protein: 0.9, carbs: 3.9, fat: 0.2 }
  - { name: ghee, amount: 10, unit: ml, kcal: 88, protein: 0, carbs: 0, fat: 10 }
  - { name: garlic, amount: 3, unit: cloves, kcal: 12, protein: 0.5, carbs: 2.7, fat: 0 }
  - { name: cumin seeds, amount: 3, unit: g, kcal: 11, protein: 0.5, carbs: 1.3, fat: 0.7 }

instructions:
  - Wash and cook dal in 3 cups of water with turmeric and salt. Pressure cook or boil until soft.
  - Cook rice according to package directions.
  - Heat ghee in a pan. Add cumin seeds and let them splutter.
  - Sauté chopped onion and minced garlic until golden.
  - Add chopped tomato and cook until soft.
  - Pour in the cooked dal and simmer for 5 minutes. Mash lightly.
  - Serve the dal alongside rice.
