title: "Khichdi"
category: big
servings: 1
prep_time: "5 min"
cook_time: "25 min"
tags: [vegetarian, comfort, indian]

ingredients:
  - { name: rice, amount: 80, unit: g, kcal: 284, protein: 5.6, carbs: 62, fat: 0.4 }
  - { name: moong dal, amount: 60, unit: g, kcal: 209, protein: 14, carbs: 36, fat: 0.7 }
  - { name: ghee, amount: 12, unit: ml, kcal: 106, protein: 0, carbs: 0, fat: 12 }
  - { name: mixed vegetables, amount: 110, unit: g, kcal: 60, protein: 2.5, carbs: 13, fat: 0.5 }
  - { name: cumin seeds, amount: 3, unit: g, kcal: 11, protein: 0.5, carbs: 1.3, fat: 0.7 }
  - { name: garlic, amount: 2, unit: cloves, kcal: 8, protein: 0.4, carbs: 1.8, fat: 0 }

instructions:
  - Wash and soak rice and moong dal together for 15 minutes. Drain.
  - Heat ghee in a pressure cooker or deep pot. Add cumin seeds and let them splutter.
  - Sauté minced garlic for 30 seconds.
  - Add chopped vegetables and cook for 2 minutes.
  - Add the rice-dal mixture, salt, turmeric, and 4 cups of water. Stir well.
  - Pressure cook for 3 whistles or simmer covered for 20 minutes until soft and porridge-like.
  - Mash lightly and serve hot with a spoon of ghee on top.
