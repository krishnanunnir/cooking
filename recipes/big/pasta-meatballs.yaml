title: "Pasta with Meatballs"
category: big
servings: 1
prep_time: "10 min"
cook_time: "20 min"
tags: [comfort, high_protein]

ingredients:
  - { name: pasta, amount: 160, unit: g, kcal: 210, protein: 8, carbs: 40, fat: 1.8 }
  - { name: beef mince, amount: 140, unit: g, kcal: 350, protein: 24, carbs: 0, fat: 28 }
  - { name: tomato sauce, amount: 100, unit: ml, kcal: 42, protein: 1.4, carbs: 7, fat: 0.8 }
  - { name: parmesan, amount: 10, unit: g, kcal: 40, protein: 3.5, carbs: 0.3, fat: 2.7 }
  - { name: olive oil, amount: 5, unit: ml, kcal: 44, protein: 0, carbs: 0, fat: 5 }

instructions:
  - Cook pasta in salted boiling water until al dente. Drain.
  - Season beef mince with salt, pepper, and herbs. Roll into small meatballs.
  - Heat olive oil in a pan. Brown meatballs on all sides.
  - Add tomato sauce, cover, and simmer for 10 minutes.
  - Toss pasta with the sauce and meatballs. Top with grated parmesan.
