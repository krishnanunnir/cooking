title: "Rice & Soybean Curry"
category: big
servings: 1
prep_time: "15 min"
cook_time: "25 min"
tags: [vegetarian, spicy, indian]

ingredients:
  - { name: rice, amount: 80, unit: g, kcal: 284, protein: 5.6, carbs: 62, fat: 0.4 }
  - { name: soy chunks, amount: 60, unit: g, kcal: 207, protein: 30, carbs: 12, fat: 4.5 }
  - { name: onion, amount: 80, unit: g, kcal: 32, protein: 0.9, carbs: 7.2, fat: 0.1 }
  - { name: tomato, amount: 100, unit: g, kcal: 18, protein: 0.9, carbs: 3.9, fat: 0.2 }
  - { name: olive oil, amount: 12, unit: ml, kcal: 106, protein: 0, carbs: 0, fat: 12 }
  - { name: garlic, amount: 3, unit: cloves, kcal: 12, protein: 0.5, carbs: 2.7, fat: 0 }
  - { name: curry powder, amount: 10, unit: g, kcal: 30, protein: 1.3, carbs: 5, fat: 1 }

instructions:
  - Soak soy chunks in hot water for 10 minutes. Drain and squeeze out excess water.
  - Cook rice according to package directions.
  - Heat oil in a pan. Sauté chopped onion and minced garlic until golden.
  - Add chopped tomato and curry powder. Cook until the tomato softens.
  - Add the soy chunks and a splash of water. Simmer for 10 minutes.
  - Serve the soybean curry over rice.
