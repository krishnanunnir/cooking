title: "Tomato Rice"
category: big
servings: 1
prep_time: "10 min"
cook_time: "20 min"
tags: [vegetarian, south_indian, one_pot]

ingredients:
  - { name: rice, amount: 95, unit: g, kcal: 337, protein: 6.7, carbs: 74, fat: 0.5 }
  - { name: tomato, amount: 200, unit: g, kcal: 36, protein: 1.8, carbs: 7.8, fat: 0.4 }
  - { name: onion, amount: 80, unit: g, kcal: 32, protein: 0.9, carbs: 7.2, fat: 0.1 }
  - { name: coconut oil, amount: 12, unit: ml, kcal: 103, protein: 0, carbs: 0, fat: 12 }
  - { name: peas, amount: 60, unit: g, kcal: 49, protein: 3.2, carbs: 8.4, fat: 0.2 }
  - { name: cashews, amount: 15, unit: g, kcal: 87, protein: 2.7, carbs: 4.5, fat: 6.6 }
  - { name: mustard seeds, amount: 3, unit: g, kcal: 15, protein: 0.6, carbs: 1, fat: 1 }

instructions:
  - Wash and soak rice for 10 minutes. Drain.
  - Heat oil in a pot. Add mustard seeds and let them splutter.
  - Sauté sliced onion until golden. Add chopped tomato and cook until mushy.
  - Add peas, cashews, turmeric, chili powder, and salt. Cook for 2 minutes.
  - Add drained rice and stir for 1 minute. Pour in 2.5 cups of water.
  - Bring to a boil, cover, and simmer on low for 15 minutes. Fluff and serve.
