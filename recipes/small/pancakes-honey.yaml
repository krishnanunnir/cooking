title: "Pancakes & Honey"
category: small
servings: 1
prep_time: "5 min"
cook_time: "10 min"
tags: [sweet, breakfast]

ingredients:
  - { name: all purpose flour, amount: 40, unit: g, kcal: 146, protein: 4, carbs: 30, fat: 0.4 }
  - { name: eggs, amount: 1, unit: large, kcal: 78, protein: 6.5, carbs: 0.6, fat: 5.5 }
  - { name: milk, amount: 50, unit: ml, kcal: 21, protein: 1.7, carbs: 2.5, fat: 0.5 }
  - { name: butter, amount: 2, unit: g, kcal: 14, protein: 0, carbs: 0, fat: 1.6 }
  - { name: honey, amount: 10, unit: g, kcal: 30, protein: 0, carbs: 8.2, fat: 0 }

instructions:
  - Whisk together flour, egg, and milk into a smooth batter.
  - Heat a non-stick pan and melt butter.
  - Pour the batter and cook for 2 minutes each side until golden.
  - Drizzle honey on top and serve warm.
