title: "Scrambled Eggs on Toast"
category: small
servings: 1
prep_time: "2 min"
cook_time: "5 min"
tags: [quick, high_protein]

ingredients:
  - { name: eggs, amount: 2, unit: large, kcal: 155, protein: 13, carbs: 1.1, fat: 11 }
  - { name: butter, amount: 7, unit: g, kcal: 50, protein: 0.1, carbs: 0, fat: 5.7 }
  - { name: bread, amount: 1, unit: slice, kcal: 70, protein: 2.5, carbs: 13, fat: 1 }
  - { name: milk, amount: 20, unit: ml, kcal: 12, protein: 0.6, carbs: 1, fat: 0.7 }

instructions:
  - Whisk eggs with milk and a pinch of salt.
  - Melt butter in a non-stick pan over medium-low heat.
  - Pour in eggs and gently stir with a spatula until soft curds form.
  - Toast the bread and serve eggs on top.
