title: "Upma"
category: small
servings: 1
prep_time: "5 min"
cook_time: "10 min"
tags: [quick, vegetarian, indian]

ingredients:
  - { name: semolina, amount: 50, unit: g, kcal: 180, protein: 5.5, carbs: 37, fat: 0.5 }
  - { name: onion, amount: 50, unit: g, kcal: 20, protein: 0.6, carbs: 4.5, fat: 0.1 }
  - { name: mixed vegetables, amount: 30, unit: g, kcal: 15, protein: 0.6, carbs: 3, fat: 0.1 }
  - { name: peanuts, amount: 8, unit: g, kcal: 46, protein: 2.1, carbs: 1.3, fat: 3.9 }
  - { name: coconut oil, amount: 4, unit: ml, kcal: 34, protein: 0, carbs: 0, fat: 4 }

instructions:
  - Dry roast the semolina in a pan over low heat for 2-3 minutes until lightly golden. Set aside.
  - Heat oil in the same pan. Sauté chopped onion until soft.
  - Add mixed vegetables (peas, carrots) and cook for 2 minutes.
  - Add 2 cups of water and bring to a boil. Add salt.
  - Slowly add the roasted semolina while stirring continuously to avoid lumps.
  - Reduce heat, cover, and cook for 3 minutes until the water is absorbed.
  - Top with peanuts and serve hot.
