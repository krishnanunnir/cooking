title: "Protein Smoothie"
category: very-small
servings: 1
prep_time: "3 min"
cook_time: "0 min"
tags: [quick, high_protein]

ingredients:
  - { name: protein powder, amount: 20, unit: g, kcal: 78, protein: 18, carbs: 2, fat: 0.5 }
